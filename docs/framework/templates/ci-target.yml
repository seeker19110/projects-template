name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      # Cài dependency TRƯỚC cổng: gate chạy lệnh thật của dự án (vd `npm test` → vitest trong devDependencies);
      # runner sạch không có node_modules thì cổng đỏ ở bước đầu (phát hiện S-05 khi chạy khung trên dự án đích,
      # 2026-10-09). Chỉ cài khi có lockfile/requirements — template vẫn dùng được cho mọi stack; pnpm/yarn/poetry
      # thì thay dòng tương ứng khi merge drop-in.
      - name: Install Node dependencies (lockfile present)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install Python dependencies (requirements.txt present)
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt
      - name: Check target commands and installed runtimes
        run: bash scripts/dev-task.sh doctor
      - name: Run reviewed build, typecheck, lint and test commands
        run: bash scripts/dev-task.sh gate
      # Spec-Anchored (đối chiếu SDD 2026-10-10): spec Approved trong docs/specs/ phải còn trỏ tới file touchpoint và bằng
      # chứng AC có thật (contract C-1..C-4 do scripts/spec-compiler.sh sinh). Engine đã phát sang đích từ 2026-09-13 nhưng
      # không job nào gọi → chết im lặng (TRAPS mục 11/25). Chưa có spec: compile in thông báo, không có test → bỏ qua.
      - name: Spec contracts (docs/specs Approved → C-1..C-4)
        run: bash scripts/spec-compiler.sh --compile-all && { ! ls tests/contracts/test_contract_*.py >/dev/null 2>&1 || python3 -m unittest discover -s tests/contracts; }
