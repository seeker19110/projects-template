name: Secret scan

# Tự động hóa luật "bí mật KHÔNG bao giờ vào Git" (CLAUDE.md mục 3, KHUNG 1 GĐ 3).
# Trước đây chỉ dựa vào .gitignore + con người — gitleaks quét diff/commit để chặn rò rỉ.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 2 * * 1'   # tuần một lần quét TOÀN lịch sử — rule mới của gitleaks / bí mật lọt trước khi bật cổng (audit 2026-09-23, C3)
  workflow_dispatch:

# gitleaks-action đọc danh sách commit của PR qua API → cần quyền đọc PR.
# Thiếu quyền này gây lỗi 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lấy đủ lịch sử để quét được toàn bộ commit trong PR/push.
          fetch-depth: 0

      - name: Quét bí mật (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Miễn phí cho repo cá nhân & repo public. Repo tổ chức cần GITLEAKS_LICENSE.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
