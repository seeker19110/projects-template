name: Release

# CD nhẹ: sinh CHANGELOG + bump phiên bản + tạo GitHub Release TỰ ĐỘNG từ
# conventional commits (release-please). Khung đã ép conventional commits (commitlint)
# nên đây là bước tận dụng sẵn — đóng phần "lịch sử thay đổi" của GĐ 6 không phải viết tay.
on:
  push:
    branches: [main]

# Quyền tối thiểu ở cấp workflow; job `release-please` tự nâng quyền cho riêng nó.
permissions:
  contents: read

# Xếp hàng, KHÔNG hủy: release-please ghi tag/CHANGELOG — hủy giữa chừng có thể
# để lại trạng thái dở dang. Nhiều commit dồn vào `main` thì chạy lần lượt.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Repo khung (chưa có package.json) → bỏ qua để không lỗi; tự bật khi có dự án thật.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.app.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có package.json — bỏ qua Release; sẽ tự chạy khi có dự án thật."
          fi

  release-please:
    needs: check
    if: needs.check.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Chỉ job này cần ghi (tạo tag/CHANGELOG/PR release) — job `check` giữ read-only.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
