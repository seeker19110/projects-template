name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quyền tối thiểu (least privilege): CI chỉ đọc mã nguồn, không ghi gì lên repo.
# Khai ở cấp workflow để không phụ thuộc mặc định của repo/tổ chức (có thể là write).
permissions:
  contents: read

# Push liên tiếp vào cùng một PR → hủy lượt chạy cũ, chỉ giữ lượt mới nhất.
# Trên `main` thì KHÔNG hủy (mỗi commit đã merge cần một kết quả CI của riêng nó).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Hàng rào cho CHÍNH bộ khung — chạy CẢ KHI CHƯA có app (không guard package.json).
  # KHUNG-1 nguyên tắc 6: tiêu chuẩn kiểm được bằng máy thì tự động hóa — áp cho chính template:
  # shell phải đúng cú pháp, JSON cấu hình phải hợp lệ. (Kiểm tra link/tên file cũ trong tài
  # liệu đã có job docs-consistency riêng bên dưới — không lặp lại ở đây.)
  framework-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache pip theo scripts/requirements-ci.txt (một nguồn ghim duy nhất, Dependabot pip theo dõi).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Cài công cụ Python của cổng (ghim ở scripts/requirements-ci.txt)
        run: python3 -m pip install --quiet -r scripts/requirements-ci.txt

      - name: Cú pháp shell (bash -n — mọi *.sh)
        run: |
          set -e
          find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n
          echo "OK: cú pháp shell sạch"

      # Cổng chặn phải được CHỨNG MINH là chặn (audit 2026-09-12, F-002) — không chỉ tồn tại.
      - name: Hook cổng thật sự chặn (pre-commit-gate + block-dangerous-git)
        run: bash scripts/test-hooks-gate.sh
      - name: Hook guard — một nguồn mẫu bí mật, biến thể lọt bộ lọc, settings đồng bộ (mục 17–19)
        run: bash scripts/test-hooks-gate-guard.sh

      # Cùng nguyên tắc F-002, áp cho 3 gate script chính của repo khung (audit 2026-09-12, G-001):
      # check-docs-consistency.sh, check-ci-policy.sh, check-progress-freshness.sh phải được CHỨNG
      # MINH bắt đúng lỗi bằng negative-test, không chỉ "chạy không crash".
      - name: 3 gate chính của khung thật sự bắt được lỗi (docs-consistency/ci-policy/progress-freshness)
        run: bash scripts/test-check-scripts.sh

      # Thân step protection-guard (ci.yml) và Detect project manifest (dependency-review.yml) cũng
      # phải được chứng minh chạy đúng với API/manifest giả lập, không chỉ "có mặt" trong workflow.
      - name: Step protection-guard và dependency-review chạy đúng với API/manifest giả lập
        run: bash scripts/test-workflow-guards.sh

      - name: new-work.sh tạo hồ sơ docs/work đúng khuôn Work ID, không ghi đè
        run: bash scripts/test-new-work.sh

      # 4 engine (spec-compiler, arch-health-radar, subagent-dispatch, telemetry-log) được thêm ở
      # PR #89/#91 KÈM self-test, nhưng self-test không được nối vào CI — nên ~650 dòng Python chạy
      # được mà không cổng nào bảo vệ (audit 2026-09-13, mục CAO-1; khuôn lỗi ghi ở TRAPS.md).
      - name: Engine next-gen chạy đúng (spec-compiler + arch-health-radar)
        run: bash scripts/test-next-gen-engines.sh

      - name: Engine telemetry + subagent-dispatch chạy đúng
        run: bash scripts/test-telemetry-and-dispatch.sh

      # Hook KHÔNG chặn gì (telemetry-record, session-resume) hỏng im lặng: audit 2026-09-23 tìm thấy
      # telemetry ghi token bịa 1000/500 + thời lượng cộng dồn chính vì không test nào đo output của nó.
      - name: Hook session (telemetry-record) ghi số thật, không cộng dồn
        run: bash scripts/test-hooks-session.sh

      # dev-task.sh phải PHÂN GIẢI ĐÚNG LỆNH từng stack (audit 2026-09-23 T4: type-check bị bỏ qua âm thầm ở
      # dự án Node điển hình, 8 stack §0b no-op) — fixture + binary giả, không cần cài stack thật.
      - name: dev-task.sh phân giải đúng lệnh cho 13 stack
        run: bash scripts/test-dev-task.sh
      - name: dev-task.sh evidence gắn phiên bản (LD-03) + review có căn cứ (LD-04)
        run: bash scripts/test-dev-task-evidence.sh

      # Characterization test khoá HÀNH VI TỪNG NHÁNH của scan_codebase_health + parse_spec_markdown
      # (không chỉ "chạy không crash"): hai hàm này là logic ĐO của khung, refactor sai làm số liệu
      # sai âm thầm. Viết trước khi hạ complexity hai hàm từ CC=18 xuống <12 (ADR-0005).
      - name: Characterization 2 engine đo (arch-health-radar + spec-compiler)
        run: bash scripts/test-engine-characterization.sh

      # Agent bảo trì toàn diện (spec 2026-09-14): engine quét phải BẮT ĐƯỢC lỗi cài sẵn (negative-test)
      # và runner đa-provider phải gọi ĐÚNG cú pháp CLI đã xác minh (stub) — không chỉ chạy không crash.
      - name: Engine bảo trì (maintenance-sweep + maintain-run) chạy đúng
        run: |
          bash scripts/test-maintenance-sweep.sh
          bash scripts/test-maintain-run.sh
          bash scripts/test-maintain-cron.sh

      - name: Runtime safety (Git local thật, CLI hữu hạn, upgrade giữ dữ liệu)
        run: python3 tests/test_runtime_safety.py

      - name: Git safety (lease maintain-cron, upgrade merge giữ dữ liệu)
        run: python3 tests/test_git_safety.py

      # Radar độ phủ cổng (arch-health-radar) chỉ ra usage-estimate.sh là script DUY NHẤT
      # không có test — nó quyết định lúc nào phiên AI bị nhắc sắp hết quota (audit 2026-09-13).
      - name: Ước tính quota chạy đúng (usage-estimate)
        run: bash scripts/test-usage-estimate.sh

      # Độ phủ DÒNG (khác độ phủ cổng): script có test nhưng test chỉ gọi --help thì độ phủ
      # cổng 100% mà độ phủ dòng ~ 0. Sàn 95%, nâng khi thêm ca — hạ phải nêu lý do trong PR.
      - name: Độ phủ dòng của 4 engine Python (coverage.py)
        run: |
          bash scripts/test-py-coverage-exit.sh
          bash scripts/test-py-coverage.sh

      # Ngưỡng CC 12 đã được nhắc ở ADR-0005 + characterization test nhưng CHƯA có cổng nào
      # cưỡng chế — nó chỉ nằm trong văn xuôi (đúng khuôn TRAPS.md mục 14). Bước này là cổng đó,
      # kèm negative test chứng minh nó bắt đúng hàm vượt trần (không chỉ chạy không crash).
      - name: Độ phức tạp vòng của engine Python ≤ CC 12 (radon)
        run: |
          bash scripts/check-python-complexity.sh
          bash scripts/test-check-python-complexity.sh

      # Nửa còn lại của cổng CC (PR #123 làm Python): shell đo bằng bản vendor có ghim
      # `vendor/shellmetrics/` — cổng tự kiểm SHA256 trước khi chạy nên không cần mạng.
      # HAI trần: hàm ≤ 12 (như Python), thân script ≤ 45 (nắp chặn trượt, đặt trên mức cao
      # nhất đo được lúc dựng cổng là 41 — xem đầu scripts/check-shell-complexity.sh).
      - name: Độ phức tạp vòng của mã shell (shellmetrics — hàm ≤ 12, thân script ≤ 45)
        run: |
          bash scripts/check-shell-complexity.sh
          bash scripts/test-check-shell-complexity.sh

      - name: Cài ShellCheck (không dựa vào gói có sẵn của runner)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # CLAUDE.md §5 ghi "Lint 0 cảnh báo" nhưng cổng này từng chạy --severity=error, tức luật
      # nói một đằng CI làm một nẻo (audit 2026-09-13, B-03). Nay chạy đúng mức luật quy định.
      # Cảnh báo hợp lệ phải khai directive KÈM LÝ DO ngay tại chỗ, không tắt mù cả file.
      - name: ShellCheck (mức warning — đúng luật "0 cảnh báo" của CLAUDE.md §5)
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 shellcheck --severity=warning

      # Tất cả suite đã có step riêng ở Linux; gate ở đây sẽ chạy lại cả 17 suite.
      # Doctor chỉ tiền kiểm. test-dev-task chứng minh gate; parity giữ đủ suite, đúng một lần.
      - name: Contract preflight (READY, not PASS)
        run: bash scripts/dev-task.sh doctor

      - name: Linux suite parity with the full local gate
        run: python3 tests/test_ci_suite_parity.py

      - name: Adaptive process contract (LD-02)
        run: python3 tests/test_adaptive_process.py

      - name: Profile quality matrix (LD-06)
        run: python3 tests/test_profile_quality_matrix.py

      - name: Lean adoption runtime evidence and protocol (LD-08)
        run: python3 tests/test_lean_adoption.py

      - name: Cú pháp Python (py_compile — scripts và tests)
        run: |
          set -e
          find scripts tests -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
          echo "OK: cú pháp Python sạch"

      - name: JSON cấu hình hợp lệ (jq)
        run: |
          set -e
          for f in .claude/settings.json .claude/settings-shared-default.json .mcp.json scripts/model-rates.json; do
            if [ -f "$f" ]; then jq empty "$f" && echo "OK $f"; fi
          done

  # ---------------------------------------------------------------------------------------------
  # CỔNG WINDOWS (2026-09-15). VÌ SAO CẦN: mọi job khác chạy ubuntu, nên cổng của khung chỉ chứng
  # minh được điều gì đó TRÊN LINUX — trong khi khung này nhắm tới người dùng Windows (có bản
  # `copy-framework.ps1`, tài liệu tiếng Việt, hướng dẫn PowerShell). Trong MỘT lượt chạy tay trên máy
  # Windows thật (2026-09-15) đã lội ra NĂM lỗi nằm im nhiều tháng, TẤT CẢ đều vô hình với CI Linux:
  #   · 4 engine Python chết vì `UnicodeEncodeError` trên console cp1252            (TRAPS mục 24, PR #134)
  #   · Python nội tuyến trong heredoc `.sh` cũng vậy                              (TRAPS mục 24, PR #137)
  #   · `vendor/shellmetrics` bị CRLF-hoá → SHA256 lệch → cổng CC shell chết hẳn  (TRAPS mục 27, PR #134)
  #   · thiếu `jq` → hook fail-open → mất sạch hàng rào mà không dấu hiệu gì        (TRAPS mục 26, PR #134)
  # Job này là cổng máy cho cả bốn khuôn đó. CỐ Ý không nhân đôi toàn bộ CI: chỉ chạy những suite
  # mà sự khác biệt nền tảng THẬT SỰ đo được (encoding, line-ending, công cụ sẵn có) — kiểm thuần
  # văn bản (docs-consistency, ci-policy) không phụ thuộc nền tảng nên không lặp lại ở đây.
  # `shell: bash` trên runner Windows = Git Bash — đúng thứ người dùng Windows thực sự dùng.
  framework-lint-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # KHÔNG đặt core.autocrlf — để nguyên mặc định của runner Windows (autocrlf=true) CHÍNH LÀ
      # điều kiện đã làm hỏng `vendor/shellmetrics`. Tắt nó ở đây sẽ làm cổng này mất ý nghĩa.
      - name: Công cụ bắt buộc phải CÓ (thiếu thì ĐỎ, không được âm thầm bỏ qua)
        run: |
          set -e
          # test-hooks-gate.sh báo "BỎ QUA" khi thiếu jq (đúng ở máy dev — xem TRAPS mục 26).
          # Trên CI thì KHÔNG: thiếu jq nghĩa là job này chứng minh được ít hơn nó tưởng.
          command -v jq      >/dev/null || { echo "::error::Runner thiếu jq — test-hooks-gate sẽ BỎ QUA và cổng này thành xanh giả."; exit 1; }
          command -v python3 >/dev/null || command -v python >/dev/null || { echo "::error::Runner thiếu Python."; exit 1; }
          echo "jq: $(jq --version) | bash: $BASH_VERSION | awk: $(awk --version 2>&1 | head -1)"

      - name: Engine Python chạy được trên console Windows (cp1252 — TRAPS mục 24)
        run: |
          set -e
          bash scripts/test-next-gen-engines.sh
          bash scripts/test-telemetry-and-dispatch.sh
          bash scripts/test-engine-characterization.sh
          bash scripts/test-usage-estimate.sh
          bash scripts/test-new-work.sh

      - name: Hook cổng chặn thật trên Windows (21 ca — cần jq, TRAPS mục 26)
        run: bash scripts/test-hooks-gate.sh
      - name: Hook guard trên Windows (mục 17–19 — cần jq, TRAPS mục 26)
        run: bash scripts/test-hooks-gate-guard.sh

      - name: Hook session trên Windows (đường dẫn MSYS qua argv, PATH tối giản bằng wrapper — F-Q6/F-Q9)
        run: bash scripts/test-hooks-session.sh

      - name: Strict gate và fixture Node thực trên Windows
        run: bash scripts/test-dev-task.sh
      - name: Evidence và review-check trên Windows (jq CRLF, TRAPS mục 26)
        run: bash scripts/test-dev-task-evidence.sh

      # Đây là cổng bắt CRLF: checkout trên Windows với autocrlf mặc định từng đổi
      # `vendor/shellmetrics` sang CRLF → SHA256 lệch → chính cổng CC shell từ chối chạy (TRAPS mục 27).
      # Nếu ai đó gỡ `vendor/** -text` khỏi `.gitattributes`, bước này đỏ ngay.
      - name: Cổng CC shell + tính toàn vẹn bản vendor (TRAPS mục 27)
        run: |
          set -e
          bash scripts/check-shell-complexity.sh
          bash scripts/test-check-shell-complexity.sh

      - name: Cổng CC Python (radon) trên Windows
        run: |
          set -e
          PY=python3; command -v python3 >/dev/null || PY=python
          "$PY" -m pip install --quiet -r scripts/requirements-ci.txt
          bash scripts/check-python-complexity.sh
          bash scripts/test-check-python-complexity.sh

      - name: Runtime safety trên Windows (Git Bash, đường dẫn có khoảng trắng)
        run: |
          PY=python3; command -v python3 >/dev/null || PY=python
          "$PY" tests/test_runtime_safety.py
          "$PY" tests/test_git_safety.py

      - name: copy-framework trên Windows thật (cả .sh lẫn .ps1)
        run: REQUIRE_PWSH=1 bash scripts/test-copy-framework.sh

  # Luôn chạy (không cần package.json) — bắt link gãy / tên file cũ sót lại trong tài liệu
  # của chính repo khung, để không phải rà tay sau mỗi lần đổi tên file.
  docs-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-docs-consistency.sh
      # Đối chiếu hai chiều job id (ci.yml/pr-policy.yml) với danh sách required checks trong
      # docs/ops/repository-settings.md — xem lý do ở đầu scripts/check-ci-policy.sh.
      - run: bash scripts/check-ci-policy.sh

  # Luôn chạy — chạy THẬT copy-framework.sh/.ps1 vào thư mục scratch để xác nhận: copy
  # đúng cấu trúc (Lớp 1 thẳng, Lớp 2 vào _framework-dropins/), KHÔNG đè file đã có ở
  # dự án đích, và chạy lại lần hai không lỗi. ubuntu-latest có sẵn pwsh nên kiểm cả .ps1.
  copy-framework-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # REQUIRE_PWSH=1 (audit 2026-09-12, F-015): trên CI bản .ps1 PHẢI được kiểm thật.
      # Không có cờ này, runner mất pwsh sẽ làm test âm thầm bỏ qua nửa phạm vi mà job vẫn xanh.
      - run: REQUIRE_PWSH=1 bash scripts/test-copy-framework.sh
      - name: Node/Python target adoption smoke (copy, real gate, offline CI boundary)
        run: bash scripts/test-adoption-smoke.sh

  # Chạy CẢ ở PR lẫn push vào main. Trước đây chỉ chạy trên main nên PROGRESS.md lỗi thời vẫn để PR
  # xanh rồi làm đỏ main sau khi merge (TRAPS 8, tái phát #245). Ở PR, HEAD là merge ref chứa lịch sử
  # main (PF-1 đúng) và nhánh PR còn mở nên tồn tại (PF-2 không báo oan) — test-check-scripts.sh có
  # ca đối chứng. fetch-depth: 0 bắt buộc để đối chiếu ancestor (PF-1).
  progress-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-progress-freshness.sh

  # Xác nhận branch protection ĐÃ ÁP THẬT (không chỉ được hứa trong tài liệu) và KHỚP với file
  # .github/rulesets/main.json (đối chiếu hai chiều) — cơ chế mượn từ seeker19110/Claude-Agents
  # (docs/QUY-TRINH-GIT.md §8): trước đây "đã bật" chỉ là lời hứa trong repository-settings.md,
  # không gì kiểm chứng; sửa ruleset qua UI có thể làm RƠI một rule mà không báo gì.
  protection-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bảo vệ nhánh đã có hiệu lực chưa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          rules=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH")
          echo "$rules" > "$RUNNER_TEMP/live-rules.json"
          has_rule()  { jq -e --arg t "$1" 'map(select(.type == $t)) | length > 0' <<<"$rules" >/dev/null; }
          has_check() { jq -e --arg c "$1" '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index($c) != null' <<<"$rules" >/dev/null; }
          fail=0
          for t in pull_request required_status_checks deletion non_fast_forward; do
            has_rule "$t" || { echo "::error::Thiếu rule '$t' trên $BRANCH"; fail=1; }
          done
          for c in $(jq -r '.rules[] | select(.type == "required_status_checks")
                            | .parameters.required_status_checks[].context' .github/rulesets/main.json); do
            has_check "$c" || { echo "::error::Status check '$c' chưa được bắt buộc trên $BRANCH"; fail=1; }
          done
          want_strict=$(jq -r '[.rules[] | select(.type == "required_status_checks")
            | .parameters.strict_required_status_checks_policy] | unique | join(",")' .github/rulesets/main.json)
          live_strict=$(jq -r '[.[] | select(.type == "required_status_checks")
            | .parameters.strict_required_status_checks_policy] | unique | join(",")' <<<"$rules")
          if [ "$want_strict" != "$live_strict" ]; then
            echo "::error::strict_required_status_checks_policy trên $BRANCH là '$live_strict', file khai '$want_strict'. Import lại .github/rulesets/main.json."
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "::error::Bảo vệ nhánh CHƯA có hiệu lực. Import .github/rulesets/main.json: Settings → Rules → Rulesets → New ruleset → Import a ruleset. Chi tiết: docs/ops/repository-settings.md."
            exit 1
          fi
          echo "OK — $BRANCH đang được bảo vệ; required status checks và strict policy khớp file."

      - name: File và ruleset thật phải khớp (đối chiếu hai chiều)
        run: |
          set -euo pipefail
          live=$(jq -r '[.[].type] | sort | unique | .[]' "$RUNNER_TEMP/live-rules.json")
          want=$(jq -r '[.rules[].type] | sort | unique | .[]' .github/rulesets/main.json)
          fail=0
          for t in $want; do
            grep -qx "$t" <<<"$live" || {
              echo "::error::Rule '$t' có trong .github/rulesets/main.json nhưng KHÔNG áp trên nhánh mặc định."
              echo "::error::Bảo vệ đang YẾU HƠN thứ repo khai. Bật lại trong Settings → Rules → Rulesets, hoặc bỏ khỏi file nếu đã cố ý không dùng."
              fail=1; }
          done
          for t in $live; do
            grep -qx "$t" <<<"$want" || {
              echo "::warning::Rule '$t' đang áp trên nhánh mặc định nhưng KHÔNG có trong .github/rulesets/main.json."
              echo "::warning::Không yếu đi, nhưng lần import lại từ file sẽ XOÁ MẤT nó. Thêm vào file cho khớp."; }
          done
          [ "$fail" = 0 ] || exit 1

  # Job TỔNG HỢP (ADR-0003, audit 2026-09-12 F-010): branch protection chỉ cần khoá MỘT tên là
  # `gate` thay vì liệt kê từng job. `if: always()` là bắt buộc — không có nó, `gate` bị SKIP khi
  # một job cha đỏ, và GitHub coi required check "skipped" là ĐẠT (hỏng im lặng).
  gate:
    if: always()
    needs: [framework-lint, framework-lint-windows, docs-consistency, copy-framework-smoke, progress-freshness, protection-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kết luận từ mọi job cổng
        env:
          # Sổ job ĐƯỢC PHÉP `skipped`, cách nhau bằng khoảng trắng. Chỉ job có `if:` mới skip được,
          # và mỗi cái phải có LÝ DO ở đây. Hiện RỖNG: không job cổng nào được skip (`progress-freshness`
          # đã chạy cả ở PR). Sổ này được `scripts/check-ci-policy.sh` (CP-5) so BẰNG ĐÚNG với tập
          # job thật sự có `if:`, hai chiều: thêm `if:` cho một job mà quên kê ⇒ đỏ; kê thừa một job
          # không còn `if:` ⇒ cũng đỏ.
          SKIP_ALLOWED: ""
          # toJSON(needs) giữ TÊN job, khác `join(needs.*.result)` chỉ cho mảng kết quả trần — không
          # có tên thì không thể phân biệt "skip hợp lệ" với "skip vì `if:` viết hỏng".
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=0
          while IFS=$'\t' read -r jid result; do
            case "$result" in
              success) ;;
              skipped)
                # `skipped` CHỈ đạt khi job có tên trong sổ. Trước PR này mọi `skipped` đều được
                # tính là đạt, nên một job bị `if:` hỏng loại ra sẽ im lặng qua cổng — cổng xanh giả
                # đúng khuôn mà chính CP-4 sinh ra để chặn, chỉ khác đường vào.
                case " $SKIP_ALLOWED " in
                  *" $jid "*) echo "bỏ qua hợp lệ: $jid (có trong SKIP_ALLOWED)" ;;
                  *) echo "::error::Job '$jid' bị BỎ QUA nhưng không có trong SKIP_ALLOWED — nếu đó là chủ ý thì thêm tên + lý do vào sổ ở ci.yml, còn không thì `if:` của nó đang loại nhầm."; bad=1 ;;
                esac
                ;;
              *) echo "::error::Job '$jid' kết thúc '$result'."; bad=1 ;;
            esac
          done < <(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | [.key, .value.result] | @tsv')
          if [ "$bad" -eq 1 ]; then
            echo "::error::Có job cổng KHÔNG thành công — xem danh sách trên. Không được merge."
            exit 1
          fi
          echo "Tất cả job cổng đạt."
