name: OpenSSF Scorecard

# Chấm điểm chuỗi cung ứng theo OpenSSF Scorecard (Pinned-Dependencies, Token-Permissions,
# Branch-Protection, Dangerous-Workflow, SAST, …) — audit 2026-09-23, C12. Chỉ đọc; kết quả lên tab
# Security → Code scanning. `publish_results: false` để không gửi ra API công khai của OpenSSF —
# dự án đích public muốn có huy hiệu thì đổi thành true (docs/ops/supply-chain.md).
on:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # scorecard-action yêu cầu để xác thực kết quả
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
